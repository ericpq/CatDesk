name: Validate Agent-preserving CatDesk

on:
  push:
    branches:
      - main
      - catdesk-agent-upgrade
      - 'upgrade/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generic Agent surface
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = \"([^\"]+)\"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          echo "CatDesk version=$version"

          for file in \
            src/activity.rs \
            src/agent_runtime.rs \
            src/checkpoints.rs \
            src/checks.rs \
            src/outline.rs \
            src/tool_registry.rs \
            docs/AGENT_UPGRADE.md; do
            test -f "$file" || { echo "Missing Agent file: $file"; exit 1; }
          done

          for symbol in \
            agent_status agent_checkpoint agent_plan agent_recover root_command \
            outline find_symbol read_symbol apply_patch \
            checkpoint_list checkpoint_restore run_checks parse_checks \
            git_status git_diff git_log git_add git_commit; do
            grep -q "$symbol" src/mcp.rs || { echo "Missing Agent tool: $symbol"; exit 1; }
          done

          test ! -e src/iyunzhi.rs || { echo "Private cinema BI leaked into generic core"; exit 1; }
          grep -q 'activity/stream' src/server.rs
          grep -q 'mod handoff' src/main.rs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run release tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Check repository hygiene
        run: git diff --check
