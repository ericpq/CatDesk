name: Build KR ARM64

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'src/**'
      - .github/workflows/build-kr-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Agent baseline
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = \"([^\"]+)\"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -f src/agent_runtime.rs
          test -f src/tool_registry.rs
          grep -q 'agent_recover' src/mcp.rs
          grep -q 'checkpoint_restore' src/mcp.rs
          grep -q 'run_checks' src/mcp.rs
          grep -q 'activity/stream' src/server.rs
          test ! -e src/iyunzhi.rs

      - name: Install Rust and musl
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add --toolchain stable aarch64-unknown-linux-musl

      - name: Build ARM64 release
        shell: bash
        run: |
          cargo +stable build --release --locked --target aarch64-unknown-linux-musl

      - name: Stage and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/catdesk dist/catdesk-linux-arm64
          chmod 755 dist/catdesk-linux-arm64
          file dist/catdesk-linux-arm64
          (cd dist && sha256sum catdesk-linux-arm64 > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload KR artifact
        uses: actions/upload-artifact@v4
        with:
          name: catdesk-${{ steps.meta.outputs.version }}-agent-kr-arm64
          path: |
            dist/catdesk-linux-arm64
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
