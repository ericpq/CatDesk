name: Agent-preserving upstream merge

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official Xeift/CatDesk tag or branch to merge, for example v0.9.6
        required: true
        default: v0.9.5
      target_branch:
        description: Fork branch that receives the validated merge
        required: true
        default: upgrade/0.9.5-agent-preserve

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge official upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref='${{ inputs.upstream_ref }}'
          target_branch='${{ inputs.target_branch }}'
          [[ "$upstream_ref" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$target_branch" =~ ^[A-Za-z0-9._/-]+$ ]]

          git config user.name "CatDesk Upgrade CI"
          git config user.email "catdesk-upgrade@users.noreply.github.com"
          git config merge.conflictStyle diff3

          if git ls-remote --exit-code --heads origin "$target_branch" >/dev/null 2>&1; then
            git fetch origin "$target_branch"
            git checkout -B "$target_branch" "origin/$target_branch"
          else
            git checkout -B "$target_branch" origin/main
          fi

          git remote add upstream https://github.com/Xeift/CatDesk.git
          git fetch upstream "$upstream_ref"
          upstream_commit="$(git rev-parse FETCH_HEAD)"

          set +e
          git merge --no-edit "$upstream_commit"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Upstream merge has conflicts. Resolve them locally with CatDesk; CI will not guess."
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Verify preserved Agent surface
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/activity.rs \
            src/agent_runtime.rs \
            src/checkpoints.rs \
            src/checks.rs \
            src/outline.rs \
            src/tool_registry.rs \
            docs/AGENT_UPGRADE.md; do
            test -f "$file" || { echo "Missing Agent file: $file"; exit 1; }
          done

          for symbol in \
            agent_status agent_checkpoint agent_plan agent_recover root_command \
            outline find_symbol read_symbol apply_patch \
            checkpoint_list checkpoint_restore run_checks parse_checks \
            git_status git_diff git_log git_add git_commit; do
            grep -q "$symbol" src/mcp.rs || { echo "Missing Agent tool: $symbol"; exit 1; }
          done

          test ! -e src/iyunzhi.rs || { echo "Private cinema BI leaked into generic core"; exit 1; }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run full Rust tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Check patch hygiene
        run: git diff --check

      - name: Push validated upgrade
        shell: bash
        run: |
          set -euo pipefail
          target_branch='${{ inputs.target_branch }}'
          git push origin HEAD:"$target_branch"
