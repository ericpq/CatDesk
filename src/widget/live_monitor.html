<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>CatDesk Monitor</title>
    <style>
      :root {
        --bg: #090d14;
        --card: #111722;
        --card-2: #161e2b;
        --edge: rgba(255,255,255,.07);
        --edge-2: rgba(255,255,255,.12);
        --fg: #edf2fb;
        --dim: #98a4b8;
        --faint: #637087;
        --idle: #3b4556;
        --busy: #5b9dff;
        --ok: #45d39a;
        --bad: #ff6b76;
        --warn: #f2b84b;
        --violet: #a78bfa;
        --cyan: #4cc9f0;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --r: 14px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 20% -10%, rgba(91,157,255,.10), transparent 30%),
          radial-gradient(circle at 95% 8%, rgba(69,211,154,.06), transparent 24%),
          var(--bg);
        color: var(--fg);
        font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { max-width: 1160px; margin: 0 auto; padding-bottom: 18px; }

      .bar {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 18px; border-bottom: 1px solid var(--edge);
        position: sticky; top: 0; background: rgba(9,13,20,.88);
        backdrop-filter: blur(12px); z-index: 5;
      }
      .brand { font-size: 13px; font-weight: 650; letter-spacing: .03em; }
      .version {
        color: var(--faint); font: 500 10px var(--mono);
        border: 1px solid var(--edge); border-radius: 999px; padding: 2px 7px;
      }
      .conn {
        margin-left: auto; font-size: 11px; color: var(--faint);
        display: flex; align-items: center; gap: 7px;
      }
      .conn i {
        width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
        box-shadow: 0 0 12px rgba(69,211,154,.45);
      }
      body[data-conn="0"] .conn i { background: var(--bad); box-shadow: none; }
      body[data-conn="0"] .conn span::after { content: "断开"; }
      body[data-conn="1"] .conn span::after { content: "已连接"; }

      .wrap { padding: 12px 18px 0; }
      .hero {
        background: linear-gradient(145deg, rgba(22,30,43,.98), rgba(17,23,34,.98));
        border: 1px solid var(--edge-2);
        border-radius: 16px; padding: 12px 16px 9px; margin-bottom: 10px;
        box-shadow: 0 16px 60px rgba(0,0,0,.18);
      }
      .hero-top {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 14px; margin-bottom: 8px;
      }
      .lede { min-width: 0; }
      .status { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
      #dot {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        background: var(--idle); transition: background .2s ease;
      }
      body[data-busy="1"] #dot {
        background: var(--busy); animation: pulse 1.4s ease-out infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(91,157,255,.5); }
        70% { box-shadow: 0 0 0 8px rgba(91,157,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(91,157,255,0); }
      }
      #state { font-size: 12px; font-weight: 650; color: var(--dim); }
      #headline {
        font-size: 16px; font-weight: 650; margin-bottom: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #subline {
        font: 400 11.5px/1.45 var(--mono); color: var(--faint);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #clock {
        flex: none; font: 600 24px/1 var(--mono); letter-spacing: -.03em;
        font-variant-numeric: tabular-nums; transition: color .2s ease;
      }
      body[data-busy="0"] #clock { color: var(--faint); font-size: 14px; }

      #graph { display: flex; align-items: flex-end; gap: 2px; height: 34px; }
      #graph span {
        flex: 1; border-radius: 3px 3px 1px 1px; background: #202838; height: 5%;
        transition: height .3s cubic-bezier(.2,.7,.3,1), background .3s ease;
      }
      .axis {
        display: flex; justify-content: space-between;
        font-size: 10px; color: #4c586c; margin-top: 6px;
      }

      .tiles {
        display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
        margin-bottom: 10px;
      }
      .tile {
        background: rgba(17,23,34,.92); border: 1px solid var(--edge);
        border-radius: 11px; padding: 8px 10px; min-width: 0;
      }
      .tile b {
        display: block; font: 600 17px/1.15 var(--mono);
        font-variant-numeric: tabular-nums; margin-bottom: 3px;
        overflow: hidden; text-overflow: ellipsis;
      }
      .tile span { font-size: 10.5px; color: var(--faint); }
      .tile.bad b { color: var(--bad); }
      .tile.warn b { color: var(--warn); }
      .tile.good b { color: var(--ok); }

      h2 {
        font-size: 11px; font-weight: 650; letter-spacing: .08em;
        color: var(--faint); margin: 0 0 8px; padding: 0 2px;
        display: flex; justify-content: space-between; align-items: baseline;
      }
      h2 em { font-style: normal; color: #4d596d; font-weight: 500; letter-spacing: 0; }

      .dashboard {
        display: grid; grid-template-columns: .9fr .9fr 1.2fr;
        gap: 10px; margin-bottom: 10px;
      }
      .chart-card {
        background: rgba(17,23,34,.92); border: 1px solid var(--edge);
        border-radius: var(--r); padding: 10px 12px; min-width: 0;
      }
      .chart-card h3 {
        margin: 0 0 2px; font-size: 12px; font-weight: 650;
      }
      .chart-card .desc { color: var(--faint); font-size: 9.5px; margin-bottom: 7px; }

      .health-wrap {
        display: grid; grid-template-columns: 112px minmax(0, 1fr);
        align-items: center; gap: 10px; min-height: 108px;
      }
      .gauge {
        width: 108px; height: 68px; position: relative; overflow: hidden;
        margin: 0 auto;
      }
      .gauge-arc {
        position: absolute; left: 6px; top: 6px; width: 96px; height: 96px;
        border: 10px solid #222b3a; border-radius: 50%;
      }
      .gauge-arc::before {
        content: ""; position: absolute; inset: -10px; border-radius: 50%;
        border: 10px solid transparent;
        border-top-color: var(--ok); border-right-color: var(--ok);
        transform: rotate(-45deg);
        opacity: .82;
      }
      .needle {
        position: absolute; left: 53px; top: 53px; width: 39px; height: 2px;
        border-radius: 2px; background: var(--fg); transform-origin: 0 50%;
        transform: rotate(-90deg); transition: transform .45s cubic-bezier(.2,.7,.3,1);
        box-shadow: 0 0 8px rgba(255,255,255,.18);
      }
      .needle::after {
        content: ""; position: absolute; left: -4px; top: -4px;
        width: 10px; height: 10px; border-radius: 50%; background: var(--fg);
      }
      .gauge-score {
        position: absolute; left: 0; right: 0; bottom: 0;
        text-align: center; font: 700 19px/1 var(--mono);
      }
      .gauge-score small { font-size: 10px; color: var(--faint); font-weight: 500; }
      .health-copy strong { display: block; font-size: 13px; margin-bottom: 3px; }
      .health-copy span { color: var(--dim); font-size: 10px; line-height: 1.45; }

      .failure-wrap {
        display: grid; grid-template-columns: 92px minmax(0, 1fr);
        align-items: center; gap: 10px; min-height: 108px;
      }
      .donut {
        width: 88px; height: 88px; border-radius: 50%;
        display: grid; place-items: center; position: relative;
        background: #222b3a;
      }
      .donut::after {
        content: ""; width: 54px; height: 54px; border-radius: 50%;
        background: var(--card); border: 1px solid var(--edge);
      }
      .donut-center {
        position: absolute; z-index: 1; text-align: center;
        font: 700 16px/1.1 var(--mono);
      }
      .donut-center small {
        display: block; margin-top: 3px; color: var(--faint); font: 500 9px/1 var(--mono);
      }
      .legend { display: grid; gap: 4px; }
      .legend-row { display: grid; grid-template-columns: 8px 1fr auto; gap: 7px; align-items: center; }
      .legend-row i { width: 7px; height: 7px; border-radius: 50%; }
      .legend-row span { color: var(--dim); font-size: 10.5px; }
      .legend-row b { font: 600 11px var(--mono); }

      .panel {
        background: rgba(17,23,34,.92); border: 1px solid var(--edge);
        border-radius: var(--r); overflow: auto; margin-bottom: 0;
      }
      .row {
        display: flex; align-items: flex-start; gap: 9px;
        padding: 7px 10px; border-bottom: 1px solid var(--edge);
      }
      .row:last-child { border-bottom: 0; }
      .row.fresh { animation: land .7s ease-out; }
      @keyframes land {
        from { background: rgba(91,157,255,.13); }
        to { background: transparent; }
      }
      .rdot {
        width: 7px; height: 7px; border-radius: 50%; flex: none;
        position: relative; top: 5px;
      }
      .rtool { flex: none; width: 108px; font-size: 11px; font-weight: 650; }
      .rbody { flex: 1 1 auto; min-width: 0; }
      .rdetail {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font: 400 9.5px var(--mono); color: var(--faint);
      }
      .rreason {
        font: 400 9.5px/1.35 var(--mono); color: var(--dim);
        white-space: pre-wrap; word-break: break-word; margin-top: 4px;
      }
      .rbadge {
        flex: none; border: 1px solid var(--edge-2); border-radius: 999px;
        padding: 1px 6px; font-size: 9px; white-space: nowrap;
      }
      .rbadge.ok { color: var(--ok); background: rgba(69,211,154,.06); }
      .rbadge.bad { color: var(--bad); background: rgba(255,107,118,.07); }
      .rbadge.warn { color: var(--warn); background: rgba(242,184,75,.07); }
      .rbadge.violet { color: var(--violet); background: rgba(167,139,250,.07); }
      .rbadge.cyan { color: var(--cyan); background: rgba(76,201,240,.07); }
      .rtime {
        flex: none; width: 58px; text-align: right;
        font: 500 10.5px var(--mono); color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rago {
        flex: none; font-size: 9.5px; color: #4d596d; width: 38px;
        text-align: right; font-variant-numeric: tabular-nums;
      }
      .empty { padding: 18px 14px; font-size: 12px; color: var(--faint); }

      .trow {
        display: grid; grid-template-columns: 105px minmax(70px,1fr) 96px;
        align-items: center; gap: 8px; padding: 6px 8px;
        border-bottom: 1px solid var(--edge);
      }
      .trow:last-child { border-bottom: 0; }
      .tname { font-size: 10.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
      .tbar {
        height: 7px; border-radius: 5px; background: #1d2635;
        overflow: hidden; position: relative;
      }
      .tbar i {
        display: block; height: 100%; border-radius: 5px; background: var(--busy);
        transition: width .35s cubic-bezier(.2,.7,.3,1);
      }
      .tbar b {
        display: block; height: 100%; position: absolute; right: 0; top: 0;
        background: var(--bad); opacity: .9;
      }
      .tnum {
        text-align: right; font: 400 9.5px var(--mono);
        color: var(--dim); font-variant-numeric: tabular-nums;
      }
      .tnum .badnum { color: var(--bad); }

      .timeline-row {
        display: grid; grid-template-columns: 110px minmax(80px,1fr) 48px;
        gap: 8px; align-items: center; padding: 6px 9px;
        border-bottom: 1px solid var(--edge);
      }
      .timeline-row:last-child { border-bottom: 0; }
      .timeline-name {
        font-size: 10.5px; font-weight: 600; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .timeline-track {
        height: 7px; background: #1d2635; border-radius: 5px; overflow: hidden;
      }
      .timeline-bar {
        height: 100%; min-width: 3px; border-radius: 5px; background: var(--busy);
        transition: width .35s cubic-bezier(.2,.7,.3,1);
      }
      .timeline-bar.ok { background: var(--ok); }
      .timeline-bar.bad { background: var(--bad); }
      .timeline-bar.warn { background: var(--warn); }
      .timeline-bar.violet { background: var(--violet); }
      .timeline-bar.cyan { background: var(--cyan); }
      .timeline-time { text-align: right; font: 500 9.5px var(--mono); color: var(--dim); }

      .mini-head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 8px; margin-bottom: 7px;
      }
      .mini-head strong { font-size: 12px; font-weight: 650; }
      .mini-head span { color: var(--faint); font-size: 9.5px; }
      .chart-card .panel { max-height: 132px; }
      .bottom-grid {
        display: grid; grid-template-columns: .9fr 1.1fr; gap: 10px;
      }
      .bottom-card {
        background: rgba(17,23,34,.92); border: 1px solid var(--edge);
        border-radius: var(--r); padding: 10px 12px; min-width: 0;
      }
      .bottom-card .panel { max-height: 205px; }

      @media (max-width: 860px) {
        .tiles { grid-template-columns: repeat(3, 1fr); }
        .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .dashboard .chart-card:last-child { grid-column: 1 / -1; }
        .bottom-grid { grid-template-columns: .9fr 1.1fr; }
        .health-wrap, .failure-wrap {
          grid-template-columns: 84px minmax(0, 1fr); min-height: 82px; gap: 7px;
        }
        .gauge { width: 84px; height: 55px; }
        .gauge-arc { left: 5px; top: 5px; width: 74px; height: 74px; border-width: 8px; }
        .gauge-arc::before { inset: -8px; border-width: 8px; }
        .needle { left: 41px; top: 41px; width: 30px; }
        .gauge-score { font-size: 17px; }
        .donut { width: 72px; height: 72px; }
        .donut::after { width: 44px; height: 44px; }
        .donut-center { font-size: 14px; }
        .chart-card .panel { max-height: 118px; }
        .bottom-card .panel { max-height: 166px; }
        .rbody, .rago { display: none; }
        .rtool { width: auto; flex: 1 1 auto; }
        .row { align-items: center; }
      }
      @media (max-width: 520px) {
        .bar { padding: 11px 14px; }
        .wrap { padding: 14px 14px 0; }
        .hero { padding: 14px 14px 11px; border-radius: 14px; }
        .hero-top { gap: 10px; margin-bottom: 10px; }
        #clock { font-size: 24px; }
        body[data-busy="0"] #clock { font-size: 12px; }
        #headline { font-size: 15px; }
        #graph { height: 42px; }
        .tiles { grid-template-columns: repeat(2, 1fr); gap: 7px; }
        .tile { padding: 9px 10px; }
        .tile b { font-size: 17px; }
        .dashboard, .bottom-grid { grid-template-columns: 1fr; }
        .dashboard .chart-card:last-child { grid-column: auto; }
        .chart-card .panel, .bottom-card .panel { max-height: none; }
        .health-wrap, .failure-wrap { grid-template-columns: 1fr; text-align: center; }
        .gauge { width: 108px; height: 68px; }
        .gauge-arc { left: 6px; top: 6px; width: 96px; height: 96px; border-width: 10px; }
        .gauge-arc::before { inset: -10px; border-width: 10px; }
        .needle { left: 53px; top: 53px; width: 39px; }
        .donut { width: 88px; height: 88px; margin: 0 auto; }
        .donut::after { width: 54px; height: 54px; }
        .legend { max-width: 220px; margin: 0 auto; width: 100%; text-align: left; }
        .row { padding: 9px 10px; gap: 7px; }
        .rbody { display: block; }
        .rtool { width: 82px; font-size: 11px; flex: none; }
        .rbadge { display: none; }
        .rtime { width: 48px; font-size: 10px; }
        .rago { display: none; }
        .trow { grid-template-columns: 92px minmax(70px,1fr) 92px; gap: 8px; padding: 8px 10px; }
        .tname { font-size: 11px; }
        .tnum { font-size: 9.5px; }
        .timeline-row { grid-template-columns: 92px minmax(70px,1fr) 48px; gap: 8px; padding: 8px 10px; }
        .timeline-name { font-size: 10.5px; }
      }
    </style>
  </head>
  <body data-busy="0" data-conn="1">
    <div id="app">
      <div class="bar">
        <span class="brand">CatDesk Monitor</span>
        <span class="version">LIVE</span>
        <span class="conn"><i></i><span></span></span>
      </div>

      <div class="wrap">
        <div class="hero">
          <div class="hero-top">
            <div class="lede">
              <div class="status"><span id="dot"></span><span id="state">空闲</span></div>
              <div id="headline">等待调用</div>
              <div id="subline"></div>
            </div>
            <div id="clock">—</div>
          </div>
          <div id="graph"></div>
          <div class="axis"><span id="axis-left"></span><span>现在</span></div>
        </div>

        <div class="tiles">
          <div class="tile"><b id="s-session">—</b><span>本次会话</span></div>
          <div class="tile"><b id="s-calls">—</b><span>累计调用</span></div>
          <div class="tile"><b id="s-tokens">—</b><span>累计 token</span></div>
          <div class="tile" id="tile-real-failed"><b id="s-real-failed">—</b><span>真正失败</span></div>
          <div class="tile" id="tile-guarded"><b id="s-guarded">—</b><span>保护性拦截</span></div>
          <div class="tile good" id="tile-health"><b id="s-health">—</b><span>运行健康</span></div>
        </div>

        <div class="dashboard">
          <div class="chart-card">
            <h3>运行健康</h3>
            <div class="desc">只对真正执行故障扣分</div>
            <div class="health-wrap">
              <div class="gauge">
                <div class="gauge-arc"></div>
                <div class="needle" id="health-needle"></div>
                <div class="gauge-score"><span id="health-score">100</span><small>%</small></div>
              </div>
              <div class="health-copy">
                <strong id="health-label">健康</strong>
                <span id="health-copy">最近运行没有真正执行故障。</span>
              </div>
            </div>
          </div>

          <div class="chart-card">
            <h3>失败构成</h3>
            <div class="desc">红色才是执行故障</div>
            <div class="failure-wrap">
              <div class="donut" id="failure-donut">
                <div class="donut-center"><span id="failure-total">0</span><small>原始失败</small></div>
              </div>
              <div class="legend" id="failure-legend"></div>
            </div>
          </div>

          <div class="chart-card">
            <div class="mini-head"><strong>工具调用</strong><span id="tools-note"></span></div>
            <div class="panel" id="tools"><div class="empty">暂无数据</div></div>
          </div>
        </div>

        <div class="bottom-grid">
          <div class="bottom-card">
            <div class="mini-head"><strong>最近耗时</strong><span>横条越长越慢</span></div>
            <div class="panel" id="timeline"><div class="empty">暂无调用</div></div>
          </div>
          <div class="bottom-card">
            <div class="mini-head"><strong>最近调用</strong><span id="recent-note"></span></div>
            <div class="panel" id="recent"><div class="empty">暂无调用</div></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var BASE = location.pathname.replace(/\/live\/?$/, "");
        var STREAM = BASE + "/activity/stream";
        var ACTIVITY = BASE + "/activity";
        var MIN_SHOW = 900;
        var SNAPSHOT_MS = 2000;
        var SHOW_RECENT = 6;
        var SHOW_TOOLS = 6;
        var SHOW_TIMELINE = 6;
        var BUCKETS = 52;
        var BUCKET_MS = 4000;

        var body = document.body;
        var stateEl = document.getElementById("state");
        var headline = document.getElementById("headline");
        var subline = document.getElementById("subline");
        var clock = document.getElementById("clock");
        var graph = document.getElementById("graph");
        var recentEl = document.getElementById("recent");
        var toolsEl = document.getElementById("tools");
        var timelineEl = document.getElementById("timeline");

        var bars = [];
        for (var i = 0; i < BUCKETS; i++) {
          var bar = document.createElement("span");
          graph.appendChild(bar);
          bars.push(bar);
        }
        document.getElementById("axis-left").textContent =
          Math.round((BUCKETS * BUCKET_MS) / 60000) + " 分钟前";

        var running = null;
        var baseElapsed = 0;
        var baseAt = 0;
        var holdUntil = 0;
        var latest = null;
        var lastEventAt = Date.now();
        var lastTopKey = "";
        var seeded = false;

        function human(ms) {
          if (ms < 1000) return Math.round(ms) + "ms";
          var s = ms / 1000;
          if (s < 60) return s.toFixed(1) + "s";
          var m = Math.floor(s / 60);
          if (m < 60) return m + "m" + String(Math.floor(s % 60)).padStart(2, "0") + "s";
          return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
        }

        function ago(ms) {
          var s = Math.max(0, Math.round(ms / 1000));
          if (s < 60) return s + "s";
          if (s < 3600) return Math.floor(s / 60) + "m";
          return Math.floor(s / 3600) + "h";
        }

        function compact(n) {
          if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
          if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
          if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
          return String(n);
        }

        function esc(s) {
          return String(s == null ? "" : s).replace(/[<>&]/g, function (c) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
          });
        }

        function kindOf(r) {
          if (r.ok) return "ok";
          return r.failureKind || "execution";
        }

        function kindMeta(kind) {
          switch (kind) {
            case "verification": return { label: "流程拦截", cls: "warn", color: "var(--warn)" };
            case "edit_conflict": return { label: "编辑冲突", cls: "warn", color: "#ffd166" };
            case "timeout": return { label: "超时", cls: "violet", color: "var(--violet)" };
            case "transient": return { label: "瞬时异常", cls: "cyan", color: "var(--cyan)" };
            case "execution": return { label: "执行失败", cls: "bad", color: "var(--bad)" };
            default: return { label: "成功", cls: "ok", color: "var(--ok)" };
          }
        }

        function isRealFailure(kind) {
          return kind === "execution" || kind === "timeout" || kind === "transient";
        }

        function paintGraph(history, serverNow) {
          var counts = new Array(BUCKETS).fill(0);
          var severity = new Array(BUCKETS).fill(0);
          var edge = serverNow || Date.now();
          for (var i = 0; i < history.length; i++) {
            var index = BUCKETS - 1 - Math.floor((edge - history[i][0]) / BUCKET_MS);
            if (index >= 0 && index < BUCKETS) {
              counts[index]++;
              if (!history[i][1]) {
                var kind = history[i][2] || "execution";
                severity[index] = Math.max(severity[index], isRealFailure(kind) ? 2 : 1);
              }
            }
          }
          var peak = Math.max.apply(null, counts) || 1;
          for (var b = 0; b < BUCKETS; b++) {
            var n = counts[b];
            bars[b].style.height = (n > 0 ? 14 + (n / peak) * 86 : 5) + "%";
            bars[b].style.background =
              n === 0 ? "#202838" :
              severity[b] === 2 ? "var(--bad)" :
              severity[b] === 1 ? "var(--warn)" : "var(--busy)";
          }
        }

        function renderRecent(list, serverNow) {
          var top = list.length ? list[0].tool + list[0].finishedMs : "";
          if (top === lastTopKey) return;
          var isNew = seeded;
          lastTopKey = top;
          seeded = true;
          var edge = serverNow || Date.now();
          document.getElementById("recent-note").textContent = list.length
            ? "保留 " + list.length + " 条"
            : "";
          if (!list.length) {
            recentEl.innerHTML = '<div class="empty">暂无调用</div>';
            return;
          }
          recentEl.innerHTML = list
            .slice(0, SHOW_RECENT)
            .map(function (r, index) {
              var meta = kindMeta(kindOf(r));
              return (
                '<div class="row' + (isNew && index === 0 ? " fresh" : "") + '">' +
                '<span class="rdot" style="background:' + meta.color + '"></span>' +
                '<span class="rtool">' + esc(r.tool) + "</span>" +
                '<span class="rbody"><span class="rdetail">' + esc(r.detail) + "</span>" +
                (r.reason ? '<div class="rreason">' + esc(r.reason) + "</div>" : "") +
                "</span>" +
                '<span class="rbadge ' + meta.cls + '">' + meta.label + "</span>" +
                '<span class="rtime">' + human(r.durationMs || 0) + "</span>" +
                '<span class="rago">' + ago(edge - r.finishedMs) + "</span>" +
                "</div>"
              );
            })
            .join("");
        }

        function renderTools(list) {
          if (!list || !list.length) {
            toolsEl.innerHTML = '<div class="empty">暂无数据</div>';
            return;
          }
          document.getElementById("tools-note").textContent = list.length + " 种工具";
          var peak = list[0].count || 1;
          toolsEl.innerHTML = list
            .slice(0, SHOW_TOOLS)
            .map(function (t) {
              var real = (t.executionFailed || 0) + (t.timedOut || 0) + (t.transient || 0);
              var callWidth = Math.max(3, (t.count / peak) * 100);
              var failWidth = t.count ? Math.min(callWidth, (real / t.count) * callWidth) : 0;
              return (
                '<div class="trow"><span class="tname">' + esc(t.tool) + "</span>" +
                '<span class="tbar"><i style="width:' + callWidth + '%"></i>' +
                (real ? '<b style="width:' + failWidth + '%"></b>' : "") +
                "</span>" +
                '<span class="tnum">' + t.count + " 次 · " + human(t.totalMs) +
                (real ? ' · <span class="badnum">真失败 ' + real + "</span>" : "") +
                "</span></div>"
              );
            })
            .join("");
        }

        function renderTimeline(list) {
          if (!list || !list.length) {
            timelineEl.innerHTML = '<div class="empty">暂无调用</div>';
            return;
          }
          var visible = list.slice(0, SHOW_TIMELINE);
          var peak = visible.reduce(function (max, item) {
            return Math.max(max, item.durationMs || 0);
          }, 1);
          timelineEl.innerHTML = visible.map(function (r) {
            var meta = kindMeta(kindOf(r));
            var width = Math.max(2, ((r.durationMs || 0) / peak) * 100);
            return (
              '<div class="timeline-row">' +
              '<span class="timeline-name">' + esc(r.tool) + "</span>" +
              '<span class="timeline-track"><i class="timeline-bar ' + meta.cls +
              '" style="display:block;width:' + width + '%"></i></span>' +
              '<span class="timeline-time">' + human(r.durationMs || 0) + "</span>" +
              "</div>"
            );
          }).join("");
        }

        function renderFailureCharts(summary, completed) {
          summary = summary || {};
          var execution = summary.executionFailed || 0;
          var timeout = summary.timedOut || 0;
          var transient = summary.transient || 0;
          var verification = summary.verificationBlocked || 0;
          var conflict = summary.editConflict || 0;
          var raw = summary.rawFailed == null
            ? execution + timeout + transient + verification + conflict
            : summary.rawFailed;
          var real = summary.realFailed == null ? execution + timeout + transient : summary.realFailed;
          var guarded = verification + conflict;
          var health = completed ? Math.max(0, Math.round(((completed - real) / completed) * 100)) : 100;

          document.getElementById("s-real-failed").textContent = real;
          document.getElementById("s-guarded").textContent = guarded;
          document.getElementById("s-health").textContent = health + "%";
          document.getElementById("tile-real-failed").classList.toggle("bad", real > 0);
          document.getElementById("tile-guarded").classList.toggle("warn", guarded > 0);

          document.getElementById("health-score").textContent = health;
          document.getElementById("health-needle").style.transform =
            "rotate(" + (-90 + health * 1.8) + "deg)";
          var label = health >= 98 ? "健康" : health >= 90 ? "轻微异常" : health >= 75 ? "需要关注" : "异常偏多";
          document.getElementById("health-label").textContent = label;
          document.getElementById("health-copy").textContent =
            real === 0
              ? "没有真正执行故障。流程保护和编辑冲突单独统计，不再污染失败数。"
              : "真正失败 " + real + " 次；保护性拦截 " + guarded + " 次。健康率只扣真正执行故障。";

          document.getElementById("failure-total").textContent = raw;
          var items = [
            ["执行失败", execution, "#ff6b76"],
            ["超时", timeout, "#a78bfa"],
            ["瞬时异常", transient, "#4cc9f0"],
            ["流程拦截", verification, "#f2b84b"],
            ["编辑冲突", conflict, "#ffd166"]
          ];
          var cursor = 0;
          var stops = [];
          if (raw > 0) {
            items.forEach(function (item) {
              if (!item[1]) return;
              var start = cursor;
              cursor += (item[1] / raw) * 100;
              stops.push(item[2] + " " + start.toFixed(2) + "% " + cursor.toFixed(2) + "%");
            });
          }
          document.getElementById("failure-donut").style.background =
            raw ? "conic-gradient(" + stops.join(",") + ")" : "#222b3a";
          document.getElementById("failure-legend").innerHTML = items.map(function (item) {
            return '<div class="legend-row"><i style="background:' + item[2] + '"></i>' +
              "<span>" + item[0] + "</span><b>" + item[1] + "</b></div>";
          }).join("");
        }

        function showRunning(list) {
          var head = list[0];
          running = head;
          baseElapsed = head.elapsedMs || 0;
          baseAt = Date.now();
          body.setAttribute("data-busy", "1");
          stateEl.textContent =
            list.length > 1 ? "运行中 · " + list.length + " 个并行" : "运行中";
          headline.textContent = head.tool;
          subline.textContent = head.detail || "";
        }

        function showIdle() {
          running = null;
          body.setAttribute("data-busy", "0");
          stateEl.textContent = "空闲";
          var last = latest && latest.recent && latest.recent[0];
          if (last) {
            headline.textContent = "刚完成 " + last.tool;
            subline.textContent =
              (last.detail ? last.detail + " · " : "") + human(last.durationMs || 0);
          } else {
            headline.textContent = "等待调用";
            subline.textContent = "";
          }
        }

        function applyEvent(data) {
          body.setAttribute("data-conn", "1");
          latest = data;
          lastEventAt = Date.now();
          var list = data.running || [];
          if (list.length) {
            showRunning(list);
            holdUntil = Date.now() + MIN_SHOW;
          }
          renderRecent(data.recent || [], data.serverTimeMs);
          renderTimeline(data.recent || []);
          document.getElementById("s-session").textContent = data.completed;
        }

        function applySnapshot(data) {
          latest = data;
          paintGraph(data.history || [], data.serverTimeMs);
          renderTools(data.byTool || []);
          renderRecent(data.recent || [], data.serverTimeMs);
          renderTimeline(data.recent || []);
          var usage = data.usage || {};
          document.getElementById("s-calls").textContent =
            usage.toolCallCount == null ? "—" : compact(usage.toolCallCount);
          document.getElementById("s-tokens").textContent =
            usage.totalTokens == null ? "—" : compact(usage.totalTokens);
          document.getElementById("s-session").textContent =
            data.completed == null ? "—" : data.completed;
          renderFailureCharts(data.failureSummary || {}, data.completed || 0);
          if (!running) showIdle();
        }

        function frame() {
          var now = Date.now();
          if (running) {
            clock.textContent = human(baseElapsed + (now - baseAt));
            if (latest && !(latest.running || []).length && now > holdUntil) {
              showIdle();
            }
          } else {
            var since = now - lastEventAt;
            clock.textContent = since < 1500 ? "刚刚" : ago(since) + " 前";
          }
          window.requestAnimationFrame(frame);
        }
        window.requestAnimationFrame(frame);

        function loadSnapshot() {
          fetch(ACTIVITY, {
            cache: "no-store",
            headers: { "ngrok-skip-browser-warning": "1" }
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) { if (data) applySnapshot(data); })
            .catch(function () {});
        }
        loadSnapshot();
        window.setInterval(loadSnapshot, SNAPSHOT_MS);

        function connect() {
          var source;
          try {
            source = new EventSource(STREAM);
          } catch (error) {
            return;
          }
          source.onopen = function () { body.setAttribute("data-conn", "1"); };
          source.onmessage = function (event) {
            try { applyEvent(JSON.parse(event.data)); } catch (error) {}
          };
          source.onerror = function () { body.setAttribute("data-conn", "0"); };
        }
        connect();
      })();
    </script>
  </body>
</html>
