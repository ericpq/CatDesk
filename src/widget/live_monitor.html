<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>CatDesk Monitor</title>
    <style>
      :root {
        --bg: #0e1117; --panel: #141922;
        --line: rgba(255,255,255,.07); --hair: rgba(255,255,255,.04);
        --fg: #e9edf5; --dim: #8b93a3; --faint: #6b7484;
        --idle: #3a4250; --busy: #5b9dff; --ok: #3ddc97; --bad: #ff6b6b;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { padding: 16px 18px 24px; max-width: 760px; margin: 0 auto; }
      .head {
        display: flex; align-items: flex-end; justify-content: space-between;
        margin-bottom: 12px;
      }
      .state { display: flex; align-items: center; gap: 9px; }
      #dot {
        width: 10px; height: 10px; border-radius: 50%; flex: none;
        background: var(--idle); transition: background .2s ease;
      }
      body[data-busy="1"] #dot {
        background: var(--busy); animation: pulse 1.35s ease-out infinite;
      }
      body[data-conn="0"] #dot { background: var(--bad); animation: none; }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(91,157,255,.55); }
        70% { box-shadow: 0 0 0 8px rgba(91,157,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(91,157,255,0); }
      }
      #state { font-size: 14px; font-weight: 500; }
      #clock {
        font: 500 30px/1 var(--mono); font-variant-numeric: tabular-nums;
        letter-spacing: -.02em; transition: color .2s ease;
      }
      body[data-busy="0"] #clock { color: var(--faint); font-size: 15px; }
      #graph {
        display: flex; align-items: flex-end; gap: 2px; height: 52px;
        padding-bottom: 2px; border-bottom: 1px solid var(--line);
      }
      #graph span {
        flex: 1; border-radius: 1px 1px 0 0; background: #232a36; height: 6%;
        transition: height .25s ease, background .25s ease;
      }
      .axis {
        display: flex; justify-content: space-between;
        font-size: 10px; color: var(--faint); margin: 4px 0 14px;
      }
      .card {
        background: var(--panel); border-radius: 8px; padding: 11px 13px;
        margin-bottom: 14px; transition: opacity .2s ease;
      }
      .card.empty { opacity: .4; }
      .cap {
        font-size: 11px; letter-spacing: .06em; color: var(--faint);
        display: flex; justify-content: space-between; align-items: baseline;
      }
      .now { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
      #tool { font-weight: 500; font-size: 13px; }
      #detail {
        font: 400 12px/1.4 var(--mono); color: var(--dim); min-height: 17px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #recent { margin: 7px 0 0; max-height: 300px; overflow-y: auto; }
      #recent::-webkit-scrollbar { width: 6px; }
      #recent::-webkit-scrollbar-thumb {
        background: #2b3342; border-radius: 3px;
      }
      .row {
        display: flex; align-items: baseline; gap: 9px; padding: 5px 0;
        border-bottom: 1px solid var(--hair);
      }
      .row.fresh { animation: land .6s ease-out; }
      @keyframes land {
        from { background: rgba(91,157,255,.14); }
        to { background: transparent; }
      }
      .rdot {
        width: 6px; height: 6px; border-radius: 50%; flex: none;
        position: relative; top: -2px;
      }
      .rtool { flex: none; font-size: 12px; font-weight: 500; }
      .rbody { flex: 1 1 auto; min-width: 0; }
      .rdetail {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font: 400 11px var(--mono); color: var(--faint);
      }
      .rreason {
        font: 400 11px/1.4 var(--mono); color: var(--bad);
        white-space: pre-wrap; word-break: break-word; margin-top: 2px;
      }
      .rtime {
        flex: none; font: 400 11px var(--mono); color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rago { flex: none; font-size: 10px; color: #4d5563; width: 46px; text-align: right; }
      #tools { margin-top: 7px; }
      .trow {
        display: flex; align-items: center; gap: 10px; padding: 4px 0;
        font-size: 12px;
      }
      .tname { flex: none; width: 132px; font-weight: 500; }
      .tbar { flex: 1 1 auto; height: 5px; border-radius: 3px; background: #1c2230; overflow: hidden; }
      .tbar i { display: block; height: 100%; background: var(--busy); border-radius: 3px; }
      .tnum {
        flex: none; font: 400 11px var(--mono); color: var(--dim);
        font-variant-numeric: tabular-nums; width: 96px; text-align: right;
      }
      .stats {
        display: flex; gap: 22px; flex-wrap: wrap;
        margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);
      }
      .stat div:first-child { font-size: 11px; color: var(--faint); margin-bottom: 2px; }
      .stat div:last-child {
        font: 500 15px var(--mono); font-variant-numeric: tabular-nums;
      }
      #err { display: none; margin-top: 10px; font-size: 12px; color: var(--bad); }
      body[data-conn="0"] #err { display: block; }
    </style>
  </head>
  <body data-busy="0" data-conn="1">
    <div id="app">
      <div class="head">
        <div class="state"><span id="dot"></span><span id="state">空闲</span></div>
        <div id="clock">—</div>
      </div>

      <div id="graph"></div>
      <div class="axis"><span id="axis-left">3 分钟前</span><span>现在</span></div>

      <div class="card empty" id="nowcard">
        <div class="now"><span class="cap">当前</span><span id="tool">—</span></div>
        <div id="detail"></div>
      </div>

      <div class="cap"><span>最近</span><span id="recent-count"></span></div>
      <div id="recent"></div>

      <div class="cap" style="margin-top:16px"><span>按工具</span><span id="tools-count"></span></div>
      <div id="tools"></div>

      <div class="stats">
        <div class="stat"><div>工具调用</div><div id="s-calls">—</div></div>
        <div class="stat"><div>累计 token</div><div id="s-tokens">—</div></div>
        <div class="stat"><div>本次会话</div><div id="s-session">—</div></div>
        <div class="stat"><div>失败</div><div id="s-failed">—</div></div>
      </div>

      <div id="err">连接断开，正在重连…</div>
    </div>

    <script>
      (function () {
        var BASE = location.pathname.replace(/\/live\/?$/, "");
        var STREAM = BASE + "/activity/stream";
        var ACTIVITY = BASE + "/activity";
        // A call is often under ten milliseconds. The event arrives, but the
        // eye needs longer than that, so a call stays on screen for this long.
        var MIN_SHOW = 900;
        var SNAPSHOT_MS = 2000;
        var BUCKETS = 58;
        var BUCKET_MS = 3000;

        var body = document.body;
        var stateEl = document.getElementById("state");
        var clock = document.getElementById("clock");
        var graph = document.getElementById("graph");
        var nowCard = document.getElementById("nowcard");
        var toolEl = document.getElementById("tool");
        var detailEl = document.getElementById("detail");
        var recentEl = document.getElementById("recent");
        var toolsEl = document.getElementById("tools");

        var bars = [];
        for (var i = 0; i < BUCKETS; i++) {
          var bar = document.createElement("span");
          graph.appendChild(bar);
          bars.push(bar);
        }
        document.getElementById("axis-left").textContent =
          Math.round((BUCKETS * BUCKET_MS) / 60000) + " 分钟前";

        var running = null;
        var baseElapsed = 0;
        var baseAt = 0;
        var holdUntil = 0;
        var latest = null;
        var lastEventAt = Date.now();
        var lastTopKey = "";
        var seededRecent = false;

        function human(ms) {
          if (ms < 1000) return Math.round(ms) + "ms";
          var s = ms / 1000;
          if (s < 60) return s.toFixed(1) + "s";
          var m = Math.floor(s / 60);
          if (m < 60) return m + "m" + String(Math.floor(s % 60)).padStart(2, "0") + "s";
          return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
        }

        function ago(ms) {
          var s = Math.max(0, Math.round(ms / 1000));
          if (s < 60) return s + "s";
          if (s < 3600) return Math.floor(s / 60) + "m";
          return Math.floor(s / 3600) + "h";
        }

        function compact(n) {
          if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
          if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
          if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
          return String(n);
        }

        function esc(s) {
          return String(s == null ? "" : s).replace(/[<>&]/g, function (c) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
          });
        }

        // The graph is drawn from the server's own timestamps, so opening the
        // page part-way through a session shows the session rather than a
        // blank strip that only starts filling from now.
        function paintGraph(history, serverNow) {
          var counts = new Array(BUCKETS).fill(0);
          var failed = new Array(BUCKETS).fill(0);
          var edge = serverNow || Date.now();
          for (var i = 0; i < history.length; i++) {
            var at = history[i][0];
            var index = BUCKETS - 1 - Math.floor((edge - at) / BUCKET_MS);
            if (index >= 0 && index < BUCKETS) {
              counts[index]++;
              if (!history[i][1]) failed[index]++;
            }
          }
          var peak = Math.max.apply(null, counts) || 1;
          for (var b = 0; b < BUCKETS; b++) {
            var n = counts[b];
            bars[b].style.height = (n > 0 ? 14 + (n / peak) * 86 : 6) + "%";
            bars[b].style.background =
              n === 0 ? "#232a36" : failed[b] ? "var(--bad)" : "var(--busy)";
          }
        }

        function renderRecent(list, serverNow) {
          var top = list.length ? list[0].tool + list[0].finishedMs : "";
          if (top === lastTopKey) return;
          var isNew = seededRecent;
          lastTopKey = top;
          seededRecent = true;
          var edge = serverNow || Date.now();
          document.getElementById("recent-count").textContent =
            list.length ? list.length + " 条" : "";
          recentEl.innerHTML = list
            .map(function (r, index) {
              return (
                '<div class="row' + (isNew && index === 0 ? " fresh" : "") + '">' +
                '<span class="rdot" style="background:' +
                (r.ok ? "var(--ok)" : "var(--bad)") + '"></span>' +
                '<span class="rtool">' + esc(r.tool) + "</span>" +
                '<span class="rbody"><span class="rdetail">' + esc(r.detail) + "</span>" +
                (r.reason ? '<div class="rreason">' + esc(r.reason) + "</div>" : "") +
                "</span>" +
                '<span class="rtime">' + human(r.durationMs || 0) + "</span>" +
                '<span class="rago">' + ago(edge - r.finishedMs) + " 前</span>" +
                "</div>"
              );
            })
            .join("");
        }

        function renderTools(list) {
          if (!list || !list.length) return;
          document.getElementById("tools-count").textContent = list.length + " 种";
          var peak = list[0].count || 1;
          toolsEl.innerHTML = list
            .slice(0, 12)
            .map(function (t) {
              return (
                '<div class="trow"><span class="tname">' + esc(t.tool) + "</span>" +
                '<span class="tbar"><i style="width:' +
                Math.max(2, (t.count / peak) * 100) + '%;background:' +
                (t.failed ? "var(--bad)" : "var(--busy)") + '"></i></span>' +
                '<span class="tnum">' + t.count + " 次 · " + human(t.totalMs) +
                "</span></div>"
              );
            })
            .join("");
        }

        function showRunning(head) {
          running = head;
          baseElapsed = head.elapsedMs || 0;
          baseAt = Date.now();
          body.setAttribute("data-busy", "1");
          nowCard.classList.remove("empty");
          toolEl.textContent = head.tool;
          detailEl.textContent = head.detail || "";
        }

        function showIdle() {
          running = null;
          body.setAttribute("data-busy", "0");
          nowCard.classList.add("empty");
          toolEl.textContent = "—";
          detailEl.textContent = "";
        }

        // Streamed events drive the state; they are small and arrive instantly.
        function applyEvent(data) {
          body.setAttribute("data-conn", "1");
          latest = data;
          lastEventAt = Date.now();
          var list = data.running || [];
          if (list.length) {
            showRunning(list[0]);
            stateEl.textContent =
              list.length > 1 ? "运行中 (" + list.length + ")" : "运行中";
            holdUntil = Date.now() + MIN_SHOW;
          }
          renderRecent(data.recent || [], data.serverTimeMs);
          document.getElementById("s-session").textContent = data.completed;
        }

        // The fetched snapshot carries what is too big to push: the graph's
        // timestamps, the per-tool totals and the usage counters.
        function applySnapshot(data) {
          paintGraph(data.history || [], data.serverTimeMs);
          renderTools(data.byTool || []);
          renderRecent(data.recent || [], data.serverTimeMs);
          var usage = data.usage || {};
          document.getElementById("s-calls").textContent =
            usage.toolCallCount == null ? "—" : usage.toolCallCount.toLocaleString();
          document.getElementById("s-tokens").textContent =
            usage.totalTokens == null ? "—" : compact(usage.totalTokens);
          document.getElementById("s-session").textContent =
            data.completed == null ? "—" : data.completed;
          var failed = (data.byTool || []).reduce(function (sum, t) {
            return sum + (t.failed || 0);
          }, 0);
          document.getElementById("s-failed").textContent = failed;
        }

        function frame() {
          var now = Date.now();
          if (running) {
            clock.textContent = human(baseElapsed + (now - baseAt));
            if (latest && !(latest.running || []).length && now > holdUntil) {
              showIdle();
              stateEl.textContent = "空闲";
            }
          } else {
            var since = now - lastEventAt;
            clock.textContent = since < 1000 ? "刚刚" : ago(since) + " 前";
          }
          window.requestAnimationFrame(frame);
        }
        window.requestAnimationFrame(frame);

        function loadSnapshot() {
          fetch(ACTIVITY, {
            cache: "no-store",
            headers: { "ngrok-skip-browser-warning": "1" },
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) { if (data) applySnapshot(data); })
            .catch(function () {});
        }
        loadSnapshot();
        window.setInterval(loadSnapshot, SNAPSHOT_MS);

        function connect() {
          var source;
          try {
            source = new EventSource(STREAM);
          } catch (error) {
            return;
          }
          source.onopen = function () {
            body.setAttribute("data-conn", "1");
          };
          source.onmessage = function (event) {
            try { applyEvent(JSON.parse(event.data)); } catch (error) {}
          };
          source.onerror = function () {
            body.setAttribute("data-conn", "0");
            stateEl.textContent = "重连中";
          };
        }
        connect();
      })();
    </script>
  </body>
</html>
