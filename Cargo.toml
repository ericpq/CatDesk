[package]
name = "catdesk"
version = "0.9.3"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ratatui = "0.29"
crossterm = "0.28"
# ngrok selects Rustls' AWS-LC provider. Keep Reqwest provider-neutral so
# Rustls sees exactly one process-level provider at runtime; retain the 0.9.3
# HTTP/2 and charset features without enabling Ring through `rustls-tls`.
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "charset", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
tiktoken-rs = "0.9.1"
image = "0.25"
rand = "0.8"
rand_mt = "4"
ngrok = "0.18.0"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
regex = "1"
globset = "0.4"
ignore = "0.4"
similar = "3.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
